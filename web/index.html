<!doctype html>
<html lang="zh-CN" class="font-sans" style="color-scheme: light">
    <head>
        <meta charset="UTF-8" />
        <base href="/" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="AI 影视与短剧创作工作台" />
        <link rel="icon" href="/beef-logo.png" type="image/png" />
        <link rel="stylesheet" href="/src/styles/globals.css" />
        <title>正在加载</title>
        <style>
            html,
            body {
                margin: 0;
                background: var(--background, #f8f8fa);
            }
            #root:empty {
                position: fixed;
                inset: 0;
                min-height: 100vh;
                overflow: hidden;
                background: var(--background);
            }
            #root:empty::after {
                content: "";
                position: absolute;
                left: 50%;
                top: 50%;
                width: min(240px, 42vw);
                aspect-ratio: 17 / 10;
                transform: translate(-50%, -50%);
                background: var(--bootstrap-ink);
                background-size: 240% 100%;
                background-position: 100% 0;
                -webkit-mask: url('/beef-logo.png') center / contain no-repeat;
                mask: url('/beef-logo.png') center / contain no-repeat;
                animation: appearance-bootstrap-shimmer 2.6s ease-in-out infinite;
            }
            @keyframes appearance-bootstrap-shimmer {
                0%, 12% { background-position: 100% 0; }
                82%, 100% { background-position: 0 0; }
            }
            @media (prefers-reduced-motion: reduce) {
                #root:empty::after {
                    animation: none;
                    background: var(--bootstrap-ink);
                }
            }
        </style>
        <script>
            // 首屏遵循已保存的偏好；新用户与无效存储使用浅色主题。
            let theme = "light";
            try {
                const saved = JSON.parse(localStorage.getItem("infinite-canvas:theme_store"))?.state;
                const preference = saved?.preference ?? saved?.theme;
                theme = preference === "system" ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : preference === "dark" ? "dark" : "light";
            } catch {}
            document.documentElement.classList.toggle("dark", theme === "dark");
            document.documentElement.style.colorScheme = theme;
            document.documentElement.style.setProperty("--background", theme === "dark" ? "#101010" : "#f8f8fa");
            document.documentElement.style.setProperty("--bootstrap-ink", theme === "dark" ? "#f3f3f5" : "#1d1d21");
        </script>
    </head>
    <body class="bg-background text-foreground antialiased">
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
