<!doctype html>
<html lang="zh-CN" class="font-sans" style="color-scheme: light">
    <head>
        <meta charset="UTF-8" />
        <base href="/" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="长钢研究院影视创作工作台，面向 AI 影视与短剧创作，集项目管理、智能生成与资产管理于一体。" />
        <link rel="icon" href="/src/components/brand/assets/institute-icon.jpg" type="image/jpeg" />
        <link rel="preload" href="/src/components/brand/assets/institute-wordmark.png" as="image" />
        <link rel="stylesheet" href="/src/styles/globals.css" />
        <title>长钢研究院 · 影视创作工作台</title>
        <style>
            html,
            body {
                margin: 0;
                background: var(--background, #f8f8fa);
            }
            #root:empty {
                position: fixed;
                inset: 0;
                min-height: 100vh;
                overflow: hidden;
                background: var(--background);
            }
            #root:empty::after {
                content: "";
                position: absolute;
                left: 50%;
                top: 50%;
                width: min(240px, 60vw);
                aspect-ratio: 18 / 7;
                transform: translate(-50%, -50%);
                background: url('/src/components/brand/assets/institute-wordmark.png') center / contain no-repeat;
                animation: appearance-bootstrap-pulse 2.6s ease-in-out infinite;
            }
            @keyframes appearance-bootstrap-pulse {
                0%, 100% { opacity: .72; }
                50% { opacity: 1; }
            }
            @media (prefers-reduced-motion: reduce) {
                #root:empty::after {
                    animation: none;
                }
            }
        </style>
        <script>
            // 首屏遵循已保存的偏好；新用户与无效存储使用浅色主题。
            let theme = "light";
            try {
                const saved = JSON.parse(localStorage.getItem("infinite-canvas:theme_store"))?.state;
                const preference = saved?.preference ?? saved?.theme;
                theme = preference === "system" ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : preference === "dark" ? "dark" : "light";
            } catch {}
            document.documentElement.classList.toggle("dark", theme === "dark");
            document.documentElement.style.colorScheme = theme;
            document.documentElement.style.setProperty("--background", theme === "dark" ? "#101010" : "#f8f8fa");
        </script>
    </head>
    <body class="bg-background text-foreground antialiased">
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
